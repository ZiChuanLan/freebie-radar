services:
  radar:
    build: .
    image: freebie-radar:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8788}:8788"
    environment:
      PORT: "8788"
      HOST: "0.0.0.0"
      DATABASE_PATH: /data/radar.db
      TZ: ${TZ:-Asia/Shanghai}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 可选：采集 linux.do 等带 Cloudflare 护盾的站点时可一起启动：
  # docker compose --profile cf up -d --build
  # 并在 .env 设置 FLARESOLVERR_URL=http://flaresolverr:8191
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    profiles: ["cf"]
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-Asia/Shanghai}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
