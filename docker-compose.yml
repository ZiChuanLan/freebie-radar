services:
  radar:
    build: .
    image: freebie-radar:latest
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      PORT: "8788"
      HOST: 0.0.0.0
      DATABASE_PATH: /data/radar.db
    env_file:
      - .env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  radar-data:
